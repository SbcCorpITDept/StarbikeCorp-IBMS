  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
    <div class="fade-element w-full max-w-md">
      <div class="brand-lockup justify-center mb-8">
        <img src="https://drive.google.com/thumbnail?id=1TkLG54Abvzrs13CBbWYCzrovIIGgI8ys&sz=w400"
             alt="Starbike Corporation Logo"
             class="brand-logo" width="76" height="76">
        <div class="brand-copy">
          <h1 class="brand-wordmark">IBMS</h1>
          <p class="brand-description"><span>Integrated Branch</span><span>Management System</span></p>
        </div>
      </div>

      <div class="glass-card rounded-3xl p-8 md:p-10 shadow-md">
        <div class="mb-8">
          <h2 class="text-xl font-bold text-slate-900">Welcome back</h2>
          <p class="text-sm text-slate-500">Please enter your details to sign in.</p>
        </div>

        <form id="loginForm" class="space-y-6">
          <div class="space-y-2">
            <label for="email" class="text-sm font-semibold text-slate-700 ml-1">Email Address</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="mail" class="w-5 h-5"></i>
              </div>
              <input type="email" id="email" required class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="name@company.com">
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
              <label for="password" class="text-sm font-semibold text-slate-700">Password</label>
              <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">Forgot password?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="lock" class="w-5 h-5"></i>
              </div>
              <input type="password" id="password" required class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" placeholder="••••••••">
              <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
                <i id="passwordIcon" data-lucide="eye" class="w-5 h-5"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center ml-1">
            <input type="checkbox" id="remember" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
            <label for="remember" class="ml-2 text-sm text-slate-600">Remember me for 7 days</label>
          </div>

          <div id="loginError"
            class="hidden p-3 rounded-lg bg-red-50 border border-red-100 flex items-center gap-3 text-red-600 text-xs font-medium">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
            <span id="loginErrorText">Invalid credentials. Please try again.</span>
          </div>

          <button type="submit" id="loginBtn" class="w-full btn-primary text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2">
            <span id="btnText">Sign In</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
        </form>

        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-white px-4 text-slate-400 font-bold tracking-wider">Or continue with</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button onclick="alert('Google sign-in is temporarily unavailable.\nPlease try again later.')" class="flex items-center justify-center gap-2 py-3 px-4 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
            <span>Google</span>
          </button>
          <button onclick="alert('GitHub sign-in is temporarily unavailable.\nPlease try again later.')" class="flex items-center justify-center gap-2 py-3 px-4 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50">
            <i class="fa-brands fa-github text-lg"></i>
            <span>GitHub</span>
          </button>
        </div>
      </div>

      <p class="text-center mt-8 text-sm text-slate-500">
        Don't have an account? <a href="#" class="font-bold text-indigo-600 hover:text-indigo-700">Request access</a>
      </p>
    </div>
  </div>

  <!-- ==================== LOGOUT MODAL ==================== -->
  <div id="logoutModal" class="modal hidden">
    <div class="modal-content">
      <div
        class="animate-pulse"
        style="width:48px;height:48px;background:#fef2f2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <i data-lucide="log-out" style="width:22px;height:22px;color:#e11d48;"></i>
      </div>
      <h3>Confirm Logout</h3>
      <p>Are you sure you want to sign out from <strong>IBMS</strong>?</p>
      <div class="modal-buttons">
        <button id="cancelLogout" class="cancel-btn">Cancel</button>
        <button id="confirmLogout" class="confirm-btn">
          <span class="logout-btn-text">Yes, Sign Out</span>
          <span class="logout-loader"></span>
        </button>
      </div>
    </div>
  </div>
