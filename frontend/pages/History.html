    <!-- MOVEMENT HISTORY -->
    <div id="movementHistoryPage" class="hidden overflow-y-auto w-full flex-1">
      <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-slate-800">Movement History</h1>
          <p class="text-sm text-slate-500">Audit trail of every movement involving your branch</p>
        </div>

        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm mb-4">
          <div class="text-sm font-semibold text-slate-800 mb-3">Filters</div>
          <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-3">
            <input id="mhFilterMCID" type="text" placeholder="MCID" class="border border-slate-200 rounded-lg px-3 py-2 text-sm" oninput="applyMovementFilters()" />
            <input id="mhFilterEngine" type="text" placeholder="Engine No" class="border border-slate-200 rounded-lg px-3 py-2 text-sm" oninput="applyMovementFilters()" />
            <input id="mhFilterTxn" type="text" placeholder="Transaction No" class="border border-slate-200 rounded-lg px-3 py-2 text-sm" oninput="applyMovementFilters()" />
            <div>
              <label class="block text-[10px] text-slate-400 mb-0.5">From</label>
              <input id="mhFilterFrom" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm" onchange="applyMovementFilters()" />
            </div>
            <div>
              <label class="block text-[10px] text-slate-400 mb-0.5">To</label>
              <input id="mhFilterTo" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-sm" onchange="applyMovementFilters()" />
            </div>
          </div>
          <div class="mt-3">
            <button class="text-xs text-slate-500 hover:text-slate-800" onclick="clearMovementFilters()">Clear filters</button>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200">
              <thead class="bg-slate-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">Date</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">MCID</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">Engine No</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">Transaction</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">From</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">To</th>
                  <th class="px-6 py-3 text-left text-xs font-medium text-slate-600 uppercase tracking-wider">User</th>
                </tr>
              </thead>
              <tbody id="mhBody" class="bg-white divide-y divide-slate-100"></tbody>
            </table>
          </div>
          <div id="mhStatus" class="text-sm text-slate-500 px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center">
            <i data-lucide="loader" class="w-4 h-4 mr-2 animate-spin"></i> Loading movement history…
          </div>
          <div id="mhPaginationBar" class="pagination-bar hidden">
            <div id="mhPaginationInfo" class="pagination-info"></div>
            <div id="mhPaginationControls" class="pagination-controls"></div>
          </div>
        </div>
      </main>
    </div>
