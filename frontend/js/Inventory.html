  <!-- ==================== MC INV TABLE SCRIPT ================== -->
  <script>
    (function () {
      'use strict';

      const tbody = document.getElementById('mcInventoryTableBody');
      let mcData = [];
      let mcFilteredData = [];

      function loadMCInventory() {
        if (!window.requireSession()) return;

        const branch = window._userBranch || 'ALL';
        const statusDiv = document.getElementById('mcInventoryStatus');

        if (statusDiv) statusDiv.innerHTML = `<i class="fas fa-spinner animate-spin mr-2"></i>Loading MC Inventory...`;
        window.mcSkelRows('mcInventoryTableBody', 7);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(data => {
              mcData = Array.isArray(data) ? data : [];
              populateMCBranchFilter(mcData);
              applyMCFilters();
            })
            .withFailureHandler(err => {
              console.error(err);
              if (statusDiv) statusDiv.innerHTML = `<span class="text-red-600">Failed to load inventory</span>`;
            })
            .getMCInventory(branch);
        } else {
          console.warn("Running in standalone mode - mock data");
          // Mock data for testing
          mcData = [/* your test data */];
          renderMCInventoryTable(mcData);
        }
      }
      window.loadMCInventory = loadMCInventory;

      function renderMCSummary(data) {
        const total = data.length;
        const available = data.filter(item => (item.currentStatus || '').toString().toLowerCase() === 'available').length;
        const inTransit = data.filter(item => (item.currentStatus || '').toString().toLowerCase() === 'in transit').length;
        const sold = data.filter(item => (item.currentStatus || '').toString().toLowerCase() === 'sold').length;
        document.getElementById('mcTotalUnits').textContent = total;
        document.getElementById('mcAvailableUnits').textContent = available;
        document.getElementById('mcInTransitUnits').textContent = inTransit;
        document.getElementById('mcSoldUnits').textContent = sold;
      }

      // Populate the Branch filter <select> from the loaded data (distinct branches).
      function populateMCBranchFilter(data) {
        const sel = document.getElementById('mcFilterBranch');
        if (!sel) return;
        const current = sel.value;
        const branches = Array.from(new Set(data.map(d => (d.currentBranch || '').trim()).filter(Boolean))).sort();
        sel.innerHTML = '<option value="">All Branches</option>' +
          branches.map(b => `<option value="${window.mcEscape(b)}">${window.mcEscape(b)}</option>`).join('');
        if (branches.indexOf(current) !== -1) sel.value = current;
      }

      const mcInvState = { currentPage: 1, filteredRows: [] };
      function renderMCInventoryTable(data) {
        mcInvState.filteredRows = data || [];
        mcInvState.currentPage = 1;
        drawMCInventoryPage();
      }
      function drawMCInventoryPage() {
        const total = mcInvState.filteredRows.length;
        const rows = window.paginateRows(mcInvState.filteredRows, mcInvState.currentPage);
        tbody.innerHTML = '';

        if (total === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-slate-400">No inventory records found</td></tr>`;
        } else {
          rows.forEach(mc => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50';
            tr.innerHTML = `
              <td class="px-6 py-4 font-mono text-xs text-slate-500">${window.mcEscape(mc.mcid) || '-'}</td>
              <td class="px-6 py-4 font-mono text-slate-800">${window.mcEscape(mc.engineNo) || '-'}</td>
              <td class="px-6 py-4 text-slate-700">${window.mcEscape(mc.model) || '-'}</td>
              <td class="px-6 py-4 text-slate-700">${window.mcEscape(mc.currentBranch) || '-'}</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 text-xs rounded-full ${window.mcStatusPill(mc.currentStatus)}">${window.mcEscape(mc.currentStatus) || 'Unknown'}</span>
              </td>
              <td class="px-6 py-4 text-slate-500 text-sm">${window.mcEscape(mc.lastMoveDate) || '-'}</td>
              <td class="px-6 py-4 text-right text-sm">
                <button onclick="openUnitProfile('${window.mcEscape(mc.mcid)}')" class="text-indigo-600 hover:underline">View</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        const statusDiv = document.getElementById('mcInventoryStatus');
        if (statusDiv) statusDiv.innerHTML = `<i data-lucide="list" class="w-4 h-4 mr-2"></i> Showing <strong class="mx-1">${total}</strong> unit${total === 1 ? '' : 's'}`;
        window.renderPagination(mcInvState, 'mcPaginationControls', 'mcPaginationInfo', 'mcPaginationBar', drawMCInventoryPage);
        if (window.lucide) lucide.createIcons();
      }

      window.applyMCFilters = function() {
        const mcid = document.getElementById('mcFilterMCID').value.trim().toLowerCase();
        const engine = document.getElementById('mcFilterEngineNo').value.trim().toLowerCase();
        const chassis = document.getElementById('mcFilterChassisNo').value.trim().toLowerCase();
        const model = document.getElementById('mcFilterModel').value.trim().toLowerCase();
        const branch = document.getElementById('mcFilterBranch').value.trim().toLowerCase();
        const status = document.getElementById('mcFilterStatus').value.trim().toLowerCase();
        mcFilteredData = mcData.filter(item => {
          return (!mcid || (item.mcid || '').toString().toLowerCase().includes(mcid))
            && (!engine || (item.engineNo || '').toString().toLowerCase().includes(engine))
            && (!chassis || (item.chassisNo || '').toString().toLowerCase().includes(chassis))
            && (!model || (item.model || '').toString().toLowerCase().includes(model))
            && (!branch || (item.currentBranch || '').toString().toLowerCase() === branch)
            && (!status || (item.currentStatus || '').toString().toLowerCase() === status);
        });
        renderMCSummary(mcFilteredData);
        renderMCInventoryTable(mcFilteredData);
      };

      window.clearMCFilters = function() {
        ['mcFilterMCID', 'mcFilterEngineNo', 'mcFilterChassisNo', 'mcFilterModel'].forEach(id => {
          const el = document.getElementById(id); if (el) el.value = '';
        });
        ['mcFilterBranch', 'mcFilterStatus'].forEach(id => {
          const el = document.getElementById(id); if (el) el.value = '';
        });
        mcFilteredData = mcData;
        renderMCSummary(mcData);
        renderMCInventoryTable(mcData);
      };

      window.toggleMCRow = function(btn) {
        const childRow = btn.closest('tr').nextElementSibling;
        childRow.classList.toggle('hidden');
        const icon = btn.querySelector('i');
        if (icon) icon.style.transform = childRow.classList.contains('hidden') ? '' : 'rotate(180deg)';
      };

      // Open the transaction modal prefilled for the selected MC
      window.openTxModal = function(type, mcid, idx) {
        const info = mcData[idx] || {};
        const details = (info.details && info.details[0]) ? info.details[0] : {};
        document.getElementById('txType').value = type || 'RR';
        const today = new Date();
        document.getElementById('txDate').value = today.toISOString().slice(0,10);
        document.getElementById('txSource').value = info.currentBranch || 'SUPPLIER';
        document.getElementById('txDestination').value = info.currentBranch || '';
        document.getElementById('txMCID').value = mcid || '';
        document.getElementById('txEngineNo').value = details.engineNo || '';
        document.getElementById('txChassisNo').value = details.chassisNo || '';
        document.getElementById('txModel').value = details.model || '';
        document.getElementById('txModelCode').value = details.modelCode || '';
        document.getElementById('txColor').value = details.color || '';
        document.getElementById('txRegion').value = info.region || '';
        document.getElementById('txBranchName').value = info.branchName || '';
        document.getElementById('txBranchCode').value = info.branchCode || '';
        document.getElementById('txUnitType').value = info.type || '';
        document.getElementById('txRRNo').value = info.rrNo || '';
        document.getElementById('txRemarks').value = '';
        window._currentTx = { mcid, details, idx };
        document.getElementById('mcTxModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      };

      window.openSupplierRR = function() {
        document.getElementById('txType').value = 'RR';
        const today = new Date();
        document.getElementById('txDate').value = today.toISOString().slice(0,10);
        document.getElementById('txSource').value = 'SUPPLIER';
        const branch = window._userBranch && window._userBranch !== 'ALL' ? window._userBranch : '';
        document.getElementById('txDestination').value = branch;
        document.getElementById('txMCID').value = '';
        document.getElementById('txEngineNo').value = '';
        document.getElementById('txChassisNo').value = '';
        document.getElementById('txModel').value = '';
        document.getElementById('txModelCode').value = '';
        document.getElementById('txColor').value = '';
        document.getElementById('txRegion').value = '';
        document.getElementById('txBranchName').value = branch;
        document.getElementById('txBranchCode').value = '';
        document.getElementById('txUnitType').value = '';
        document.getElementById('txRRNo').value = '';
        document.getElementById('txRemarks').value = '';
        window._currentTx = { newRR: true };
        document.getElementById('mcTxModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      };

      window.closeTxModal = function() { document.getElementById('mcTxModal').classList.add('hidden'); document.body.style.overflow = ''; window._currentTx = null; };

      window.submitTx = function() {
        const txType = document.getElementById('txType').value;
        const txDate = document.getElementById('txDate').value;
        const source = document.getElementById('txSource').value.trim();
        const destination = document.getElementById('txDestination').value.trim();
        const remarks = document.getElementById('txRemarks').value.trim();
        const cur = window._currentTx || {};
        if (!cur.mcid && !cur.newRR) { alert('No MC selected'); return; }

        const header = {
          TransactionType: txType,
          Source: source,
          Destination: destination,
          TransactionDate: txDate,
          CreatedBy: 'WebUser',
          Remarks: remarks,
          Region: document.getElementById('txRegion').value.trim(),
          BranchName: document.getElementById('txBranchName').value.trim(),
          BranchCode: document.getElementById('txBranchCode').value.trim(),
          Type: document.getElementById('txUnitType').value.trim(),
          RRNo: document.getElementById('txRRNo').value.trim(),
          RegionArea: document.getElementById('txRegion').value.trim()
        };
        const details = [{
          MCID: document.getElementById('txMCID').value.trim() || cur.mcid || '',
          EngineNo: document.getElementById('txEngineNo').value.trim() || cur.details?.engineNo || '',
          ChassisNo: document.getElementById('txChassisNo').value.trim() || cur.details?.chassisNo || '',
          Model: document.getElementById('txModel').value.trim() || cur.details?.model || '',
          ModelCode: document.getElementById('txModelCode').value.trim() || cur.details?.modelCode || '',
          Color: document.getElementById('txColor').value.trim() || cur.details?.color || ''
        }];
        if (!details[0].MCID && txType === 'RR') {
          alert('Please enter MCID for the new RR entry.');
          return;
        }

        function onSuccess(res) {
          if (res && res.success) {
            alert('Transaction recorded: ' + res.transactionNo);
            closeTxModal();
            if (typeof window.loadMCInventory === 'function') window.loadMCInventory();
          } else {
            alert('Failed to record transaction: ' + (res && res.message ? res.message : 'Unknown'));
          }
        }

        function onFail(err) { console.error(err); alert('Server error while recording transaction'); }

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          if (txType === 'RR') google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFail).recordRR(header, details);
          else if (txType === 'IB-OUT') google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFail).recordIBOut(header, details);
          else if (txType === 'IB-IN') google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFail).recordIBIn(header, details);
          else if (txType === 'SALE') google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFail).recordSale(header, details);
          else google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFail).createTransaction(Object.assign({}, header, { Details: details }));
        } else {
          console.warn('Apps Script not detected - running in standalone mode');
          setTimeout(() => onSuccess({ success: true, transactionNo: txType + '-LOCAL' + Date.now() }), 400);
        }
      };

      // History modal
      window.openHistoryModal = function(mcid) {
        document.getElementById('historyContent').innerHTML = '<div class="text-sm text-slate-500">Loading...</div>';
        document.getElementById('mcHistoryModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.withSuccessHandler(renderHistory).withFailureHandler(err => { document.getElementById('historyContent').innerText = 'Failed to load history'; console.error(err); }).getMCHistory(mcid);
        } else {
          // standalone mock
          setTimeout(() => renderHistory([{ MovementID: 'MOV-LOCAL', MCID: mcid, TransactionNo: 'RR-LOCAL', TransactionType: 'RR', FromLocation: 'SUPPLIER', ToLocation: 'LOCAL-BR', MovementDate: new Date().toISOString().slice(0,10), PerformedBy: 'Local', Remarks: 'Mock' }]), 400);
        }
      };

      window.closeHistoryModal = function() { document.getElementById('mcHistoryModal').classList.add('hidden'); document.body.style.overflow = ''; document.getElementById('historyContent').innerHTML = ''; };

      function renderHistory(rows) {
        if (!rows || !rows.length) { document.getElementById('historyContent').innerHTML = '<div class="text-sm text-slate-500">No history records found</div>'; return; }
        const html = rows.map(r => `
          <div class="mb-3 p-3 border rounded">
            <div class="text-sm font-medium">${r.MovementDate || ''} · ${r.TransactionNo || ''} · ${r.TransactionType || ''}</div>
            <div class="text-xs text-slate-600">${r.FromLocation || ''} → ${r.ToLocation || ''}</div>
            <div class="text-xs text-slate-500 mt-1">By: ${r.PerformedBy || ''} ${r.Remarks ? ' · ' + r.Remarks : ''}</div>
          </div>
        `).join('');
        document.getElementById('historyContent').innerHTML = html;
      }

    })();
  </script>

  <!-- ==================== PHASE 4 — INVENTORY DASHBOARD ==================== -->
  <script>
  (function () {
    const state = { branchChart: null, modelChart: null, branchesLoaded: false };

    // Populate the branch dropdown once from getBranches().
    function ensureBranches(cb) {
      if (state.branchesLoaded) { cb && cb(); return; }
      google.script.run.withSuccessHandler(function (branches) {
        const sel = document.getElementById('invDashBranch');
        if (sel) {
          (branches || []).forEach(b => {
            const o = document.createElement('option');
            o.value = b; o.textContent = b;
            sel.appendChild(o);
          });
          if (window._userBranch && window._userBranch !== 'ALL') sel.value = window._userBranch;
        }
        state.branchesLoaded = true; cb && cb();
      }).withFailureHandler(function () { state.branchesLoaded = true; cb && cb(); }).getAvailableBranches();
    }

    window.loadInventoryDashboard = function () {
      ensureBranches(function () {
        const sel = document.getElementById('invDashBranch');
        const branch = (sel && sel.value) || window._userBranch || 'ALL';
        // Skeletons until data arrives
        window.mcSkelCards(['invTotal', 'invAvailable', 'invInTransit', 'invSold']);
        window.mcChartSkel('invBranchChart', true);
        window.mcChartSkel('invModelChart', true);
        window.mcSkelList('invRecentList', 5);
        google.script.run
          .withSuccessHandler(renderInventoryDashboard)
          .withFailureHandler(function (err) {
            window.mcChartSkel('invBranchChart', false);
            window.mcChartSkel('invModelChart', false);
            const recent = document.getElementById('invRecentList');
            if (recent) recent.innerHTML = '<div class="px-5 py-6 text-sm text-red-500">Failed to load: ' + err + '</div>';
          })
          .getInventoryDashboardStats(branch);
      });
    };

    function setNum(id, v) { const el = document.getElementById(id); if (el) el.textContent = (v || 0).toLocaleString(); }

    function renderInventoryDashboard(stats) {
      stats = stats || {};
      setNum('invTotal', stats.total);
      setNum('invAvailable', stats.available);
      setNum('invInTransit', stats.inTransit);
      setNum('invSold', stats.sold);
      renderBar('invBranchChart', 'branchChart', stats.byBranch, '#1E40AF', false);
      renderBar('invModelChart', 'modelChart', stats.byModel, '#2563EB', true);
      renderRecent(stats.recent || []);
      if (window.lucide) lucide.createIcons();
    }

    const PALETTE = ['#1E40AF', '#2563EB', '#16A34A', '#F59E0B', '#DC2626', '#7C3AED', '#0891B2', '#DB2777'];

    function renderBar(canvasId, stateKey, obj, color, multi) {
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;
      if (window.mcChartSkel) window.mcChartSkel(canvasId, false); // clear skeleton
      if (state[stateKey]) state[stateKey].destroy();
      const labels = Object.keys(obj || {});
      const values = labels.map(k => obj[k]);
      const bg = multi ? labels.map((_, i) => PALETTE[i % PALETTE.length]) : color;
      state[stateKey] = new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
          labels: labels.length ? labels : ['No data'],
          datasets: [{
            data: values.length ? values : [0],
            backgroundColor: labels.length ? bg : '#e2e8f0',
            borderRadius: 6, maxBarThickness: 38
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1e293b', padding: 10, cornerRadius: 8 } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 } } },
            y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } }
          }
        }
      });
    }

    function badgeClass(type) {
      return ({
        'RR': 'bg-emerald-50 text-emerald-700',
        'IB-OUT': 'bg-amber-50 text-amber-700',
        'IB-IN': 'bg-blue-50 text-blue-700',
        'SALE': 'bg-orange-50 text-orange-700'
      })[type] || 'bg-slate-100 text-slate-600';
    }

    function renderRecent(list) {
      const box = document.getElementById('invRecentList');
      if (!box) return;
      if (!list.length) { box.innerHTML = '<div class="px-5 py-6 text-sm text-slate-400">No transactions yet.</div>'; return; }
      box.innerHTML = list.map(t => `
        <div class="px-5 py-3 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold ${badgeClass(t.type)}">${t.type || ''}</span>
            <div>
              <div class="text-sm font-semibold text-slate-800">${t.transactionNo || ''}</div>
              <div class="text-xs text-slate-400">${t.from || ''} → ${t.to || ''}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs text-slate-500">${t.date || ''}</div>
            <div class="text-[11px] text-slate-400">${t.status || ''}</div>
          </div>
        </div>`).join('');
    }
  })();
  </script>

  <!-- ==================== PHASE 4 — SHARED MC HELPERS ==================== -->
  <script>
    // Status pill classes shared across MC pages.
    window.mcStatusPill = function (status) {
      const s = (status || '').toString().toLowerCase();
      if (s === 'available') return 'bg-emerald-100 text-emerald-700';
      if (s === 'in transit') return 'bg-amber-100 text-amber-700';
      if (s === 'sold') return 'bg-slate-200 text-slate-700';
      return 'bg-slate-100 text-slate-600';
    };
    window.mcTypeBadge = function (type) {
      return ({
        'RR': 'bg-emerald-50 text-emerald-700',
        'IB-OUT': 'bg-amber-50 text-amber-700',
        'IB-IN': 'bg-blue-50 text-blue-700',
        'SALE': 'bg-orange-50 text-orange-700'
      })[type] || 'bg-slate-100 text-slate-600';
    };
    window.mcEscape = function (s) {
      return (s == null ? '' : String(s)).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    };
  </script>

  <!-- ==================== PHASE 4 — MOTORCYCLE PROFILE ==================== -->
  <script>
  (function () {
    let currentRR = '';

    window.openUnitProfile = function (mcid) {
      currentRR = '';
      document.getElementById('pfLoading').classList.remove('hidden');
      document.getElementById('pfBody').classList.add('hidden');
      document.getElementById('pfError').classList.add('hidden');
      document.getElementById('pfTitle').textContent = 'Motorcycle Profile';
      document.getElementById('pfStatusPill').classList.add('hidden');
      showPage('unitProfilePage', null);
      google.script.run
        .withSuccessHandler(renderUnitProfile)
        .withFailureHandler(function (err) {
          document.getElementById('pfLoading').classList.add('hidden');
          const e = document.getElementById('pfError');
          e.classList.remove('hidden');
          e.textContent = 'Failed to load profile: ' + err;
        })
        .getUnitProfile(mcid);
    };

    window.openRRFromProfile = function () {
      if (!currentRR) return;
      if (typeof window.openRRDetails === 'function') window.openRRDetails(currentRR);
      else showPage('rrListPage', null);
    };

    function set(id, v) { const el = document.getElementById(id); if (el) el.textContent = v || '-'; }

    function renderUnitProfile(res) {
      document.getElementById('pfLoading').classList.add('hidden');
      const unit = res && res.unit;
      if (!unit) {
        const e = document.getElementById('pfError');
        e.classList.remove('hidden');
        e.textContent = 'Motorcycle not found.';
        return;
      }
      document.getElementById('pfBody').classList.remove('hidden');
      document.getElementById('pfTitle').textContent = unit.mcid || 'Motorcycle Profile';

      const pill = document.getElementById('pfStatusPill');
      pill.className = 'px-2.5 py-1 text-xs rounded-full ' + window.mcStatusPill(unit.currentStatus);
      pill.textContent = unit.currentStatus || 'Unknown';
      pill.classList.remove('hidden');

      set('pfEngine', unit.engineNo);
      set('pfChassis', unit.chassisNo);
      set('pfModel', unit.model);
      set('pfModelCode', unit.modelCode);
      set('pfColor', unit.color);
      set('pfMcid', unit.mcid);
      set('pfBranch', unit.currentBranch);
      set('pfStatus', unit.currentStatus);
      set('pfLastMove', unit.lastMoveDate || unit.lastUpdated);

      currentRR = unit.originalRR || '';
      set('pfOriginalRR', currentRR || 'None');
      const rrBtn = document.getElementById('pfViewRRBtn');
      if (currentRR) rrBtn.classList.remove('hidden'); else rrBtn.classList.add('hidden');

      renderTimeline(res.timeline || []);
      if (window.lucide) lucide.createIcons();
    }

    function renderTimeline(moves) {
      const box = document.getElementById('pfTimeline');
      if (!moves.length) { box.innerHTML = '<div class="text-sm text-slate-400">No movements recorded.</div>'; return; }
      box.innerHTML =
        '<ol class="relative border-l border-slate-200 ml-3">' +
        moves.map(m => `
          <li class="mb-6 ml-6 last:mb-0">
            <span class="absolute -left-2.5 flex h-5 w-5 items-center justify-center rounded-full ring-4 ring-white ${window.mcTypeBadge(m.TransactionType)}">
              <span class="h-2 w-2 rounded-full bg-current"></span>
            </span>
            <div class="flex flex-wrap items-center gap-2">
              <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${window.mcTypeBadge(m.TransactionType)}">${window.mcEscape(m.TransactionType)}</span>
              <span class="text-sm font-semibold text-slate-800">${window.mcEscape(m.TransactionNo)}</span>
              <span class="text-xs text-slate-400">${window.mcEscape(m.MovementDate)}</span>
            </div>
            <div class="mt-1 text-sm text-slate-600">${window.mcEscape(m.FromLocation)} <span class="text-slate-400">&rarr;</span> ${window.mcEscape(m.ToLocation)}</div>
            ${m.Remarks ? '<div class="mt-0.5 text-xs text-slate-400">' + window.mcEscape(m.Remarks) + '</div>' : ''}
          </li>`).join('') +
        '</ol>';
    }
  })();
  </script>

  <!-- ==================== PHASE 4 — TOAST ==================== -->
  <script>
    window.mcToast = function (msg, type) {
      let host = document.getElementById('mcToastHost');
      if (!host) {
        host = document.createElement('div');
        host.id = 'mcToastHost';
        host.className = 'fixed top-5 right-5 z-[100] flex flex-col gap-2';
        document.body.appendChild(host);
      }
      const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-slate-800' };
      const t = document.createElement('div');
      t.className = 'text-white text-sm px-4 py-3 rounded-xl shadow-lg ' + (colors[type] || colors.info);
      t.textContent = msg;
      host.appendChild(t);
      setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    };
  </script>

  <!-- ==================== PHASE 4 — RECEIVING REPORTS ==================== -->
  <script>
  (function () {
    let rrData = [];

    window.loadRRList = function () {
      const branch = window._userBranch || 'ALL';
      const status = document.getElementById('rrListStatus');
      if (status) status.innerHTML = '<i data-lucide="loader" class="w-4 h-4 mr-2 animate-spin"></i> Loading receiving reports…';
      window.mcSkelRows('rrListBody', 6);
      if (window.lucide) lucide.createIcons();
      google.script.run
        .withSuccessHandler(function (rows) { rrData = rows || []; renderRRList(rrData); })
        .withFailureHandler(function (err) {
          if (status) status.innerHTML = '<span class="text-red-600">Failed to load: ' + err + '</span>';
        })
        .getRRList(branch);
    };

    window.applyRRSearch = function () {
      const q = (document.getElementById('rrSearch').value || '').trim().toLowerCase();
      renderRRList(!q ? rrData : rrData.filter(r =>
        (r.transactionNo || '').toLowerCase().includes(q) || (r.branch || '').toLowerCase().includes(q)));
    };

    const rrState = { currentPage: 1, filteredRows: [] };
    function renderRRList(rows) {
      rrState.filteredRows = rows || [];
      rrState.currentPage = 1;
      drawRRPage();
    }
    function drawRRPage() {
      const body = document.getElementById('rrListBody');
      const status = document.getElementById('rrListStatus');
      const total = rrState.filteredRows.length;
      const rows = window.paginateRows(rrState.filteredRows, rrState.currentPage);
      if (!total) {
        body.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-slate-400">No receiving reports yet.</td></tr>';
      } else {
        body.innerHTML = rows.map(r => `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 font-mono font-semibold text-slate-800">${window.mcEscape(r.transactionNo)}</td>
            <td class="px-6 py-4 text-slate-600">${window.mcEscape(r.date)}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(r.branch)}</td>
            <td class="px-6 py-4 text-slate-700">${r.units}</td>
            <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs rounded-full bg-emerald-50 text-emerald-700">${window.mcEscape(r.status) || 'Completed'}</span></td>
            <td class="px-6 py-4 text-right text-sm">
              <button onclick="openRRDetails('${window.mcEscape(r.transactionNo)}')" class="text-indigo-600 hover:underline">View</button>
            </td>
          </tr>`).join('');
      }
      if (status) status.innerHTML = '<i data-lucide="list" class="w-4 h-4 mr-2"></i> Showing <strong class="mx-1">' + total + '</strong> report' + (total === 1 ? '' : 's');
      window.renderPagination(rrState, 'rrPaginationControls', 'rrPaginationInfo', 'rrPaginationBar', drawRRPage);
      if (window.lucide) lucide.createIcons();
    }

    // ── RR Details ──
    window.openRRDetails = function (transactionNo) {
      document.getElementById('rrdLoading').classList.remove('hidden');
      document.getElementById('rrdBody').classList.add('hidden');
      document.getElementById('rrdError').classList.add('hidden');
      document.getElementById('rrdTitle').textContent = transactionNo || 'RR Details';
      showPage('rrDetailsPage', null);
      google.script.run
        .withSuccessHandler(renderRRDetails)
        .withFailureHandler(function (err) {
          document.getElementById('rrdLoading').classList.add('hidden');
          const e = document.getElementById('rrdError');
          e.classList.remove('hidden'); e.textContent = 'Failed to load RR: ' + err;
        })
        .getRRDetails(transactionNo);
    };

    function renderRRDetails(res) {
      document.getElementById('rrdLoading').classList.add('hidden');
      const h = res && res.header;
      if (!h) {
        const e = document.getElementById('rrdError');
        e.classList.remove('hidden'); e.textContent = 'Receiving report not found.';
        return;
      }
      document.getElementById('rrdBody').classList.remove('hidden');
      document.getElementById('rrdTitle').textContent = h.TransactionNo || 'RR Details';
      const pill = document.getElementById('rrdStatusPill');
      pill.className = 'px-2.5 py-1 text-xs rounded-full bg-emerald-50 text-emerald-700';
      pill.textContent = h.Status || 'Completed';
      pill.classList.remove('hidden');

      document.getElementById('rrdNo').textContent = h.TransactionNo || '-';
      document.getElementById('rrdSupplier').textContent = h.SourceLocation || '-';
      document.getElementById('rrdDate').textContent = h.TransactionDate || '-';
      document.getElementById('rrdBranch').textContent = h.DestinationLocation || '-';
      document.getElementById('rrdUnits').textContent = (res.units || []).length;
      document.getElementById('rrdRemarks').textContent = h.Remarks || '—';

      const body = document.getElementById('rrdUnitsBody');
      const units = res.units || [];
      body.innerHTML = !units.length
        ? '<tr><td colspan="7" class="text-center py-8 text-slate-400">No motorcycles in this RR.</td></tr>'
        : units.map(u => `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 font-mono text-slate-800">${window.mcEscape(u.engineNo)}</td>
            <td class="px-6 py-4 font-mono text-slate-600">${window.mcEscape(u.chassisNo)}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(u.model)}</td>
            <td class="px-6 py-4 font-mono text-slate-600">${window.mcEscape(u.modelCode)}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(u.currentBranch) || '-'}</td>
            <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs rounded-full ${window.mcStatusPill(u.status)}">${window.mcEscape(u.status) || '-'}</span></td>
            <td class="px-6 py-4 text-right text-sm">
              <button onclick="openUnitProfile('${window.mcEscape(u.mcid)}')" class="text-indigo-600 hover:underline">View Profile</button>
            </td>
          </tr>`).join('');
      if (window.lucide) lucide.createIcons();
    }

    // ── New RR modal ──
    window.openNewRR = function () {
      const branch = (window._userBranch && window._userBranch !== 'ALL') ? window._userBranch : '';
      document.getElementById('rrFormNo').value = '';
      document.getElementById('rrFormDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('rrFormBranch').value = branch;
      document.getElementById('rrFormRemarks').value = '';
      document.getElementById('rrFormError').classList.add('hidden');
      document.getElementById('rrUnitsFormBody').innerHTML = '';
      addRRUnitRow(); addRRUnitRow();

      // Populate supplier dropdown (once) from getSuppliers().
      const sup = document.getElementById('rrFormSupplier');
      if (sup) {
        sup.value = '';
        if (!sup.dataset.loaded) {
          google.script.run.withSuccessHandler(function (list) {
            sup.innerHTML = '<option value="">Select supplier…</option>' +
              (list || []).map(s => `<option value="${window.mcEscape(s)}">${window.mcEscape(s)}</option>`).join('');
            sup.dataset.loaded = '1';
          }).getSuppliers();
        }
      }

      document.getElementById('newRRModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
    };
    window.closeNewRR = function () {
      document.getElementById('newRRModal').classList.add('hidden');
      document.body.style.overflow = '';
    };
    window.addRRUnitRow = function () {
      const tr = document.createElement('tr');
      tr.className = 'rr-unit-row border-t border-slate-100';
      const inp = 'w-full min-w-[10rem] border border-slate-200 rounded-lg px-3 py-2.5 text-sm';
      tr.innerHTML = `
        <td class="px-2 py-1"><input class="${inp} rr-engine" type="text" /></td>
        <td class="px-2 py-1"><input class="${inp} rr-chassis" type="text" /></td>
        <td class="px-2 py-1"><input class="${inp} rr-model" type="text" /></td>
        <td class="px-2 py-1"><input class="${inp} rr-modelcode" type="text" /></td>
        <td class="px-2 py-1"><input class="${inp} rr-color" type="text" /></td>
        <td class="px-2 py-1 text-center"><button onclick="this.closest('tr').remove()" class="text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>`;
      document.getElementById('rrUnitsFormBody').appendChild(tr);
      if (window.lucide) lucide.createIcons();
    };

    window.submitNewRR = function () {
      const err = document.getElementById('rrFormError');
      err.classList.add('hidden');
      const rrNo = document.getElementById('rrFormNo').value.trim();
      const branch = document.getElementById('rrFormBranch').value.trim();
      const supplier = document.getElementById('rrFormSupplier').value.trim();
      if (!supplier) return showErr('Select a supplier.');
      if (!rrNo) return showErr('RR No is required.');
      if (!branch) return showErr('Your account has no branch set — cannot receive units.');

      const units = [];
      document.querySelectorAll('#rrUnitsFormBody .rr-unit-row').forEach(row => {
        const eng = row.querySelector('.rr-engine').value.trim();
        const chs = row.querySelector('.rr-chassis').value.trim();
        const mdl = row.querySelector('.rr-model').value.trim();
        if (!eng && !chs && !mdl) return; // skip blank rows
        units.push({
          EngineNo: eng, ChassisNo: chs, Model: mdl,
          ModelCode: row.querySelector('.rr-modelcode').value.trim(),
          Color: row.querySelector('.rr-color').value.trim()
        });
      });
      if (!units.length) return showErr('Add at least one motorcycle (engine, chassis, or model).');

      pendingRR = {
        rrNo: rrNo, branch: branch, supplier: supplier, units: units,
        payload: {
          RRNo: rrNo, Branch: branch, Supplier: supplier,
          Date: document.getElementById('rrFormDate').value,
          Remarks: document.getElementById('rrFormRemarks').value.trim(),
          CreatedBy: (window._userEmail || ''), Units: units
        }
      };
      openRRReview();

      function showErr(m) { err.textContent = m; err.classList.remove('hidden'); return false; }
    };
    function showErr(m) { const e = document.getElementById('rrFormError'); e.textContent = m; e.classList.remove('hidden'); return false; }

    // ── RR review-and-confirm (checkbox + countdown) ──
    let pendingRR = null, rrTimer = null, rrCountdownDone = false, rrRemaining = 0;
    const RR_REVIEW_SECONDS = 5;

    function openRRReview() {
      const p = pendingRR; if (!p) return;
      document.getElementById('rvSupplier').textContent = p.supplier;
      document.getElementById('rvNo').textContent = p.rrNo;
      document.getElementById('rvBranch').textContent = p.branch;
      document.getElementById('rvCount').textContent = p.units.length;
      document.getElementById('rvUnitsBody').innerHTML = p.units.map(u => `
        <tr class="border-t border-slate-100">
          <td class="px-4 py-2 font-mono text-slate-800">${window.mcEscape(u.EngineNo) || '-'}</td>
          <td class="px-4 py-2 font-mono text-slate-600">${window.mcEscape(u.ChassisNo) || '-'}</td>
          <td class="px-4 py-2 text-slate-700">${window.mcEscape(u.Model) || '-'}</td>
        </tr>`).join('');
      document.getElementById('rvVerifyChk').checked = false;
      document.getElementById('rrReviewModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
      startRRCountdown(RR_REVIEW_SECONDS);
    }
    function startRRCountdown(sec) {
      if (rrTimer) { clearInterval(rrTimer); rrTimer = null; }
      rrCountdownDone = false; rrRemaining = sec;
      updateRRConfirmState();
      rrTimer = setInterval(function () {
        rrRemaining--;
        if (rrRemaining <= 0) { clearInterval(rrTimer); rrTimer = null; rrCountdownDone = true; }
        updateRRConfirmState();
      }, 1000);
    }
    window.updateRRConfirmState = function () {
      const btn = document.getElementById('rvConfirmBtn');
      if (!rrCountdownDone) {
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');
        btn.textContent = 'Please review… (' + rrRemaining + ')';
        return;
      }
      const ready = document.getElementById('rvVerifyChk').checked;
      btn.disabled = !ready;
      btn.classList.toggle('opacity-60', !ready);
      btn.classList.toggle('cursor-not-allowed', !ready);
      btn.textContent = 'Confirm & Save RR';
    };
    window.closeRRReview = function () {
      if (rrTimer) { clearInterval(rrTimer); rrTimer = null; }
      document.getElementById('rrReviewModal').classList.add('hidden');
      // keep body scroll locked because the New RR modal is still open behind it
      document.body.style.overflow = 'hidden';
    };
    window.confirmRRFinal = function () {
      const p = pendingRR; if (!p) return;
      const btn = document.getElementById('rvConfirmBtn');
      if (btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            btn.disabled = false; btn.textContent = 'Confirm & Save RR';
            window.mcAlert((res && res.message) || 'Failed to create RR.', { title: 'Could not create RR' });
            return;
          }
          closeRRReview();
          closeNewRR();
          window.mcToast('RR ' + res.transactionNo + ' created (' + p.units.length + ' unit' + (p.units.length === 1 ? '' : 's') + ')', 'success');
          window.mcInventoryLoaded = false; window.invDashLoaded = false;
          loadRRList();
        })
        .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Confirm & Save RR'; window.mcAlert('' + e, { title: 'Could not create RR' }); })
        .createReceivingReport(p.payload);
    };
  })();
  </script>

  <!-- ==================== PHASE 4 — TRANSFERS ==================== -->
  <script>
  (function () {
    let ctUnits = [];       // available units for the create form
    let confirmCtx = null;  // { ibOutNo, units }

    // ── Transfers list + pending receipts ──
    window.loadTransfers = function () {
      const branch = window._userBranch || 'ALL';
      const status = document.getElementById('transfersStatus');
      if (status) status.innerHTML = '<i data-lucide="loader" class="w-4 h-4 mr-2 animate-spin"></i> Loading transfers…';
      window.mcSkelRows('transfersBody', 8);
      if (window.lucide) lucide.createIcons();

      google.script.run.withSuccessHandler(renderPendingReceipts)
        .withFailureHandler(function () {}).getPendingTransfers(branch);

      google.script.run
        .withSuccessHandler(renderTransfers)
        .withFailureHandler(function (err) { if (status) status.innerHTML = '<span class="text-red-600">Failed: ' + err + '</span>'; })
        .getTransfers(branch);
    };

    function renderPendingReceipts(rows) {
      const card = document.getElementById('pendingReceiptsCard');
      const body = document.getElementById('pendingReceiptsBody');
      if (!rows || !rows.length) { card.classList.add('hidden'); return; }
      card.classList.remove('hidden');
      body.innerHTML = rows.map(t => `
        <div class="px-5 py-3 flex items-center justify-between">
          <div>
            <div class="text-sm font-semibold text-slate-800 font-mono">${window.mcEscape(t.transactionNo)}</div>
            <div class="text-xs text-slate-500">${window.mcEscape(t.from)} <span class="text-slate-400">→</span> ${window.mcEscape(t.to)} · ${t.units} unit(s) · ${window.mcEscape(t.date)}</div>
          </div>
          <button onclick="openConfirmReceipt('${window.mcEscape(t.transactionNo)}', ${t.units})" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-700">
            <i data-lucide="check" class="w-3.5 h-3.5"></i> Receive
          </button>
        </div>`).join('');
      if (window.lucide) lucide.createIcons();
    }

    const tfState = { currentPage: 1, filteredRows: [] };
    function renderTransfers(rows) {
      tfState.filteredRows = rows || [];
      tfState.currentPage = 1;
      drawTransfersPage();
    }
    function drawTransfersPage() {
      const body = document.getElementById('transfersBody');
      const status = document.getElementById('transfersStatus');
      const total = tfState.filteredRows.length;
      const rows = window.paginateRows(tfState.filteredRows, tfState.currentPage);
      if (!total) {
        body.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-slate-400">No transfers yet.</td></tr>';
      } else {
        const myBranch = (window._userBranch || '').toLowerCase();
        body.innerHTML = rows.map(t => {
          const stCls = (t.status || '').toLowerCase() === 'pending' ? 'bg-amber-100 text-amber-700'
            : (t.status || '').toLowerCase() === 'completed' ? 'bg-emerald-100 text-emerald-700'
            : (t.status || '').toLowerCase() === 'cancelled' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600';
          // The sending branch can cancel its own pending IB-OUT.
          const canCancel = t.type === 'IB-OUT' && (t.status || '').toLowerCase() === 'pending'
            && (myBranch === 'all' || (t.from || '').toLowerCase() === myBranch);
          const action = canCancel
            ? `<button onclick="openCancelTransfer('${window.mcEscape(t.transactionNo)}')" class="text-red-600 hover:underline text-sm">Cancel</button>`
            : '<span class="text-slate-300 text-sm">—</span>';
          return `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 font-mono font-semibold text-slate-800">${window.mcEscape(t.transactionNo)}</td>
            <td class="px-6 py-4"><span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${window.mcTypeBadge(t.type)}">${window.mcEscape(t.type)}</span></td>
            <td class="px-6 py-4 text-slate-600">${window.mcEscape(t.date)}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(t.from)}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(t.to)}</td>
            <td class="px-6 py-4 text-slate-700">${t.units}</td>
            <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs rounded-full ${stCls}">${window.mcEscape(t.status)}</span></td>
            <td class="px-6 py-4 text-right">${action}</td>
          </tr>`;
        }).join('');
      }
      if (status) status.innerHTML = '<i data-lucide="list" class="w-4 h-4 mr-2"></i> Showing <strong class="mx-1">' + total + '</strong> transfer' + (total === 1 ? '' : 's');
      window.renderPagination(tfState, 'tfPaginationControls', 'tfPaginationInfo', 'tfPaginationBar', drawTransfersPage);
      if (window.lucide) lucide.createIcons();
    }

    // ── Create IB-OUT ──
    window.openCreateTransfer = function () {
      const src = (window._userBranch && window._userBranch !== 'ALL') ? window._userBranch : '';
      document.getElementById('ctSource').value = src;
      document.getElementById('ctNo').value = '';
      document.getElementById('ctDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('ctRemarks').value = '';
      document.getElementById('ctError').classList.add('hidden');
      document.getElementById('ctSelCount').textContent = '0 selected';
      const sa = document.getElementById('ctSelectAll'); if (sa) sa.checked = false;
      showPage('createTransferPage', null);

      // Destination options — value MUST be the canonical "Code - Name" string
      // (e.g. "CMB - Cawayan") so it matches _userBranch / MC_MASTER.CurrentBranch.
      // Storing just the code ("CMB") breaks branch matching everywhere.
      google.script.run.withSuccessHandler(function (branches) {
        const sel = document.getElementById('ctDest');
        sel.innerHTML = '<option value="">Select branch…</option>' +
          (branches || [])
            .map(b => ((b.code || '') + ' - ' + (b.name || '')).trim())
            .filter(full => full && full !== src)
            .map(full => `<option value="${window.mcEscape(full)}">${window.mcEscape(full)}</option>`).join('');
      }).getBranches();

      // Available units at source
      const st = document.getElementById('ctUnitsStatus');
      st.textContent = 'Loading available units…';
      document.getElementById('ctUnitsBody').innerHTML = '';
      google.script.run.withSuccessHandler(function (units) {
        ctUnits = units || [];
        renderCtUnits(ctUnits);
      }).withFailureHandler(function (e) { st.textContent = 'Failed: ' + e; }).getAvailableUnits(src || 'ALL');
    };

    function renderCtUnits(units) {
      const body = document.getElementById('ctUnitsBody');
      const st = document.getElementById('ctUnitsStatus');
      if (!units.length) {
        body.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-400">No available units at your branch.</td></tr>';
      } else {
        body.innerHTML = units.map((u, i) => `
          <tr class="hover:bg-slate-50">
            <td class="px-4 py-3"><input type="checkbox" class="ct-unit-cb" data-idx="${i}" onchange="updateTransferSelCount()" /></td>
            <td class="px-4 py-3 font-mono text-slate-800">${window.mcEscape(u.engineNo)}</td>
            <td class="px-4 py-3 font-mono text-slate-600">${window.mcEscape(u.chassisNo)}</td>
            <td class="px-4 py-3 text-slate-700">${window.mcEscape(u.model)}</td>
          </tr>`).join('');
      }
      st.textContent = units.length + ' available unit(s)';
      updateTransferSelCount();
    }

    window.toggleAllTransferUnits = function (master) {
      document.querySelectorAll('.ct-unit-cb').forEach(cb => { cb.checked = master.checked; });
      updateTransferSelCount();
    };
    window.updateTransferSelCount = function () {
      const n = document.querySelectorAll('.ct-unit-cb:checked').length;
      document.getElementById('ctSelCount').textContent = n + ' selected';
    };

    // Step 1: validate, then open the review-and-confirm modal (does NOT submit yet).
    let pendingTransfer = null;
    let tcTimer = null;
    const TRANSFER_REVIEW_SECONDS = 5;

    window.submitTransfer = function () {
      const err = document.getElementById('ctError');
      err.classList.add('hidden');
      const src = document.getElementById('ctSource').value.trim();
      const dest = document.getElementById('ctDest').value.trim();
      const no = document.getElementById('ctNo').value.trim();
      if (!src) return show('Your account has no branch set.');
      if (!dest) return show('Select a destination branch.');
      if (!no) return show('IB-OUT No is required.');

      const selected = Array.from(document.querySelectorAll('.ct-unit-cb:checked'))
        .map(cb => ctUnits[parseInt(cb.dataset.idx, 10)])
        .filter(Boolean)
        .map(u => ({ MCID: u.mcid, EngineNo: u.engineNo, ChassisNo: u.chassisNo, Model: u.model, ModelCode: u.modelCode }));
      if (!selected.length) return show('Select at least one unit.');

      pendingTransfer = {
        src: src, dest: dest, no: no, selected: selected,
        payload: {
          TransactionNo: no, Source: src, Destination: dest,
          Date: document.getElementById('ctDate').value,
          Remarks: document.getElementById('ctRemarks').value.trim(),
          CreatedBy: (window._userEmail || ''), Units: selected
        }
      };
      openTransferReview();

      function show(m) { err.textContent = m; err.classList.remove('hidden'); return false; }
    };

    // Step 2: show the details + a countdown-gated Confirm button.
    function openTransferReview() {
      const p = pendingTransfer; if (!p) return;
      document.getElementById('tcFrom').textContent = p.src;
      document.getElementById('tcTo').textContent = p.dest;
      document.getElementById('tcNo').textContent = p.no;
      document.getElementById('tcCount').textContent = p.selected.length;
      document.getElementById('tcUnitsBody').innerHTML = p.selected.map(u => `
        <tr class="border-t border-slate-100">
          <td class="px-4 py-2 font-mono text-slate-800">${window.mcEscape(u.EngineNo) || '-'}</td>
          <td class="px-4 py-2 font-mono text-slate-600">${window.mcEscape(u.ChassisNo) || '-'}</td>
          <td class="px-4 py-2 text-slate-700">${window.mcEscape(u.Model) || '-'}</td>
        </tr>`).join('');
      document.getElementById('transferConfirmModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
      startTransferCountdown(TRANSFER_REVIEW_SECONDS);
    }

    function startTransferCountdown(sec) {
      const btn = document.getElementById('tcConfirmBtn');
      if (tcTimer) { clearInterval(tcTimer); tcTimer = null; }
      let remaining = sec;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      btn.textContent = 'Please review… (' + remaining + ')';
      tcTimer = setInterval(function () {
        remaining--;
        if (remaining <= 0) {
          clearInterval(tcTimer); tcTimer = null;
          btn.disabled = false;
          btn.classList.remove('opacity-60', 'cursor-not-allowed');
          btn.textContent = 'Confirm & Transfer';
        } else {
          btn.textContent = 'Please review… (' + remaining + ')';
        }
      }, 1000);
    }

    window.closeTransferReview = function () {
      if (tcTimer) { clearInterval(tcTimer); tcTimer = null; }
      document.getElementById('transferConfirmModal').classList.add('hidden');
      document.body.style.overflow = '';
    };

    // Step 3: actually create the IB-OUT.
    window.confirmTransferFinal = function () {
      const p = pendingTransfer; if (!p) return;
      const btn = document.getElementById('tcConfirmBtn');
      if (btn.disabled) return; // guard: countdown not finished
      btn.disabled = true; btn.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) {
            btn.disabled = false; btn.textContent = 'Confirm & Transfer';
            window.mcAlert((res && res.message) || 'Failed to create transfer.', { title: 'Could not create transfer' });
            return;
          }
          closeTransferReview();
          window.mcToast('Transfer ' + res.transactionNo + ' created — ' + p.selected.length + ' unit(s) in transit', 'success');
          window.mcInventoryLoaded = false; window.invDashLoaded = false;
          showPage('transfersPage', null); loadTransfers();
        })
        .withFailureHandler(function (e) {
          btn.disabled = false; btn.textContent = 'Confirm & Transfer';
          window.mcAlert('' + e, { title: 'Could not create transfer' });
        })
        .createIBOut(p.payload);
    };

    // ── Confirm receipt (IB-IN): review details + checkbox + countdown + typed number ──
    let crTimer = null, crCountdownDone = false, crRemaining = 0;
    const RECEIVE_REVIEW_SECONDS = 5;

    window.openConfirmReceipt = function (ibOutNo, unitCount) {
      confirmCtx = { ibOutNo: ibOutNo, units: unitCount };
      document.getElementById('crFrom').textContent = '…';
      document.getElementById('crTo').textContent = '…';
      document.getElementById('crUnitCount').textContent = unitCount || '-';
      document.getElementById('crUnitsBody').innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-center text-slate-400">Loading units…</td></tr>';
      document.getElementById('crIBInNo').value = '';
      document.getElementById('crVerifyChk').checked = false;
      document.getElementById('crError').classList.add('hidden');
      document.getElementById('confirmReceiptModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
      startReceiveCountdown(RECEIVE_REVIEW_SECONDS);

      // Load the transfer's real units (engine numbers) for review.
      google.script.run.withSuccessHandler(function (res) {
        const h = res && res.header;
        const units = (res && res.units) || [];
        document.getElementById('crFrom').textContent = (h && h.from) || '-';
        document.getElementById('crTo').textContent = (h && h.to) || '-';
        document.getElementById('crUnitCount').textContent = units.length;
        document.getElementById('crUnitsBody').innerHTML = units.length
          ? units.map(u => `<tr class="border-t border-slate-100"><td class="px-4 py-2 font-mono text-slate-800">${window.mcEscape(u.engineNo) || '-'}</td><td class="px-4 py-2 font-mono text-slate-600">${window.mcEscape(u.chassisNo) || '-'}</td><td class="px-4 py-2 text-slate-700">${window.mcEscape(u.model) || '-'}</td></tr>`).join('')
          : '<tr><td colspan="3" class="px-4 py-4 text-center text-slate-400">No units found.</td></tr>';
      }).withFailureHandler(function () {
        document.getElementById('crUnitsBody').innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-center text-red-500">Failed to load units.</td></tr>';
      }).getTransferDetails(ibOutNo);
    };

    function startReceiveCountdown(sec) {
      if (crTimer) { clearInterval(crTimer); crTimer = null; }
      crCountdownDone = false; crRemaining = sec;
      updateReceiveConfirmState();
      crTimer = setInterval(function () {
        crRemaining--;
        if (crRemaining <= 0) { clearInterval(crTimer); crTimer = null; crCountdownDone = true; }
        updateReceiveConfirmState();
      }, 1000);
    }

    // Enable Confirm only when: countdown done AND checkbox ticked AND a number is entered.
    window.updateReceiveConfirmState = function () {
      const btn = document.getElementById('crSubmitBtn');
      if (!crCountdownDone) {
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');
        btn.textContent = 'Please review… (' + crRemaining + ')';
        return;
      }
      const chk = document.getElementById('crVerifyChk').checked;
      const hasNo = document.getElementById('crIBInNo').value.trim().length > 0;
      const ready = chk && hasNo;
      btn.disabled = !ready;
      btn.classList.toggle('opacity-60', !ready);
      btn.classList.toggle('cursor-not-allowed', !ready);
      btn.textContent = 'Confirm & Receive';
    };

    window.closeConfirmReceipt = function () {
      if (crTimer) { clearInterval(crTimer); crTimer = null; }
      document.getElementById('confirmReceiptModal').classList.add('hidden');
      document.body.style.overflow = '';
      confirmCtx = null;
    };

    window.submitConfirmReceipt = function () {
      if (!confirmCtx) return;
      const btn = document.getElementById('crSubmitBtn');
      if (btn.disabled) return; // countdown / checkbox / number gate
      const err = document.getElementById('crError');
      err.classList.add('hidden');
      if (!document.getElementById('crVerifyChk').checked) { err.textContent = 'Please tick the verification box first.'; err.classList.remove('hidden'); return; }
      const ibInNo = document.getElementById('crIBInNo').value.trim();
      if (!ibInNo) { err.textContent = 'Enter the transfer number to confirm.'; err.classList.remove('hidden'); return; }
      // Client-side match check — does NOT reveal the number, just accepts/rejects.
      if (ibInNo.toLowerCase() !== (confirmCtx.ibOutNo || '').toLowerCase()) {
        err.textContent = 'That number does not match this transfer. Check your delivery document and try again.';
        err.classList.remove('hidden');
        return;
      }
      btn.disabled = true; btn.textContent = 'Receiving…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { btn.disabled = false; btn.textContent = 'Confirm & Receive'; window.mcAlert((res && res.message) || 'Failed to confirm receipt.', { title: 'Could not receive transfer' }); return; }
          window.mcToast('Received ' + confirmCtx.ibOutNo, 'success');
          window.mcInventoryLoaded = false; window.invDashLoaded = false;
          closeConfirmReceipt(); loadTransfers();
        })
        .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Confirm & Receive'; window.mcAlert('' + e, { title: 'Could not receive transfer' }); })
        .confirmIBIn({ IBOutNo: confirmCtx.ibOutNo, IBInNo: ibInNo, CreatedBy: (window._userEmail || '') });
    };

    // ── Cancel a pending IB-OUT (mistaken transfer recovery) ──
    let cancelCtx = null, cxTimer = null, cxRemaining = 0, cxDone = false;
    const CANCEL_REVIEW_SECONDS = 3;

    window.openCancelTransfer = function (ibNo) {
      cancelCtx = { ibNo: ibNo };
      document.getElementById('cxNo').textContent = ibNo;
      document.getElementById('cxFrom').textContent = '…';
      document.getElementById('cxTo').textContent = '…';
      document.getElementById('cxUnitsBody').innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-center text-slate-400">Loading units…</td></tr>';
      document.getElementById('cxReason').value = '';
      document.getElementById('cancelTransferModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
      startCancelCountdown(CANCEL_REVIEW_SECONDS);
      google.script.run.withSuccessHandler(function (res) {
        const h = res && res.header; const units = (res && res.units) || [];
        document.getElementById('cxFrom').textContent = (h && h.from) || '-';
        document.getElementById('cxTo').textContent = (h && h.to) || '-';
        document.getElementById('cxUnitsBody').innerHTML = units.length
          ? units.map(u => `<tr class="border-t border-slate-100"><td class="px-4 py-2 font-mono text-slate-800">${window.mcEscape(u.engineNo) || '-'}</td><td class="px-4 py-2 font-mono text-slate-600">${window.mcEscape(u.chassisNo) || '-'}</td><td class="px-4 py-2 text-slate-700">${window.mcEscape(u.model) || '-'}</td></tr>`).join('')
          : '<tr><td colspan="3" class="px-4 py-4 text-center text-slate-400">No units found.</td></tr>';
      }).withFailureHandler(function () {
        document.getElementById('cxUnitsBody').innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-center text-red-500">Failed to load units.</td></tr>';
      }).getTransferDetails(ibNo);
    };
    function startCancelCountdown(sec) {
      if (cxTimer) { clearInterval(cxTimer); cxTimer = null; }
      cxDone = false; cxRemaining = sec; updateCancelState();
      cxTimer = setInterval(function () {
        cxRemaining--;
        if (cxRemaining <= 0) { clearInterval(cxTimer); cxTimer = null; cxDone = true; }
        updateCancelState();
      }, 1000);
    }
    function updateCancelState() {
      const btn = document.getElementById('cxConfirmBtn');
      if (!cxDone) {
        btn.disabled = true; btn.classList.add('opacity-60', 'cursor-not-allowed');
        btn.textContent = 'Please review… (' + cxRemaining + ')';
        return;
      }
      btn.disabled = false; btn.classList.remove('opacity-60', 'cursor-not-allowed');
      btn.textContent = 'Cancel this transfer';
    }
    window.closeCancelTransfer = function () {
      if (cxTimer) { clearInterval(cxTimer); cxTimer = null; }
      document.getElementById('cancelTransferModal').classList.add('hidden');
      document.body.style.overflow = ''; cancelCtx = null;
    };
    window.confirmCancelFinal = function () {
      if (!cancelCtx) return;
      const btn = document.getElementById('cxConfirmBtn');
      if (btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Cancelling…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success) { btn.disabled = false; btn.textContent = 'Cancel this transfer'; window.mcAlert((res && res.message) || 'Failed to cancel.', { title: 'Could not cancel transfer' }); return; }
          window.mcToast('Transfer ' + cancelCtx.ibNo + ' cancelled — ' + res.units + ' unit(s) back to Available', 'success');
          window.mcInventoryLoaded = false; window.invDashLoaded = false;
          closeCancelTransfer(); loadTransfers();
        })
        .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Cancel this transfer'; window.mcAlert('' + e, { title: 'Could not cancel transfer' }); })
        .cancelIBOut({ IBOutNo: cancelCtx.ibNo, Reason: document.getElementById('cxReason').value.trim(), CreatedBy: (window._userEmail || '') });
    };
  })();
  </script>

  <!-- ==================== PHASE 4 — SALES (UNIT RELEASES) ==================== -->
  <script>
  (function () {
    let salesData = [];

    window.loadSales = function () {
      const branch = window._userBranch || 'ALL';
      const status = document.getElementById('salesStatus');
      if (status) status.innerHTML = '<i data-lucide="loader" class="w-4 h-4 mr-2 animate-spin"></i> Loading sales…';
      window.mcSkelRows('salesBody', 8);
      if (window.lucide) lucide.createIcons();
      google.script.run
        .withSuccessHandler(function (rows) { salesData = rows || []; applySalesSearch(); })
        .withFailureHandler(function (err) { if (status) status.innerHTML = '<span class="text-red-600">Failed: ' + err + '</span>'; })
        .getSales(branch);
    };

    window.applySalesSearch = function () {
      const q = (document.getElementById('salesSearch').value || '').trim().toLowerCase();
      const fields = ['transactionNo', 'siNo', 'customer', 'accountNo', 'engineNo'];
      renderSales(!q ? salesData : salesData.filter(s =>
        fields.some(f => (s[f] || '').toString().toLowerCase().includes(q))));
    };


    const saleState = { currentPage: 1, filteredRows: [] };
    function renderSales(rows) {
      saleState.filteredRows = rows || [];
      saleState.currentPage = 1;
      drawSalesPage();
    }
    function drawSalesPage() {
      const body = document.getElementById('salesBody');
      const status = document.getElementById('salesStatus');
      const total = saleState.filteredRows.length;
      const rows = window.paginateRows(saleState.filteredRows, saleState.currentPage);
      if (!total) {
        body.innerHTML = '<tr><td colspan="8" class="text-center py-12 text-slate-400">No unit releases yet.</td></tr>';
      } else {
        body.innerHTML = rows.map(s => `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 font-mono font-semibold text-slate-800">${window.mcEscape(s.transactionNo)}</td>
            <td class="px-6 py-4 text-slate-600">${window.mcEscape(s.date)}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(s.customer)}</td>
            <td class="px-6 py-4 font-mono text-slate-700">${window.mcEscape(s.accountNo) || '-'}</td>
            <td class="px-6 py-4 font-mono text-slate-700">${window.mcEscape(s.engineNo) || '-'}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(s.unitType) || '-'}</td>
            <td class="px-6 py-4 text-slate-700">${window.mcEscape(s.branch)}</td>
            <td class="px-6 py-4"><span class="px-2.5 py-1 text-xs rounded-full bg-orange-50 text-orange-700">${window.mcEscape(s.status) || 'Completed'}</span></td>
          </tr>`).join('');
      }
      if (status) status.innerHTML = '<i data-lucide="list" class="w-4 h-4 mr-2"></i> Showing <strong class="mx-1">' + total + '</strong> release' + (total === 1 ? '' : 's');
      window.renderPagination(saleState, 'salePaginationControls', 'salePaginationInfo', 'salePaginationBar', drawSalesPage);
      if (window.lucide) lucide.createIcons();
    }

    // ── Create Unit Release (1 sale = 1 customer = 1 motorcycle) ──
    // Step 1 picks one Available unit; step 2 fills the release form. The
    // Transaction ID is issued by the server once per form and kept through
    // "Change unit". Branch always follows the selected unit's CurrentBranch.
    const ur = { transactionId: '', units: [], selectedMcid: '', unit: null, branch: '', customers: [], customer: null, scope: '', customersLoaded: false };
    let urFormVersion = 0;
    let urCustomerRequest = 0;
    let urSaving = false;
    let urCustomerIndex = -1;
    function urEl(id) { return document.getElementById(id); }
    function urScopeAll() { return ur.scope.toUpperCase() === 'ALL'; }
    function urToday() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    window.openCreateSale = function () {
      if (urSaving) return;
      closeSaleReview();
      const formVersion = ++urFormVersion;
      Object.assign(ur, { transactionId: '', units: [], selectedMcid: '', unit: null, branch: '', customers: [], customer: null,
        scope: (window._userBranch || '').trim(), customersLoaded: false });
      urEl('urCustomerList').classList.add('hidden');
      ['urEngineSearch', 'urAccountNo', 'urCustomerSearch', 'urContact', 'urAddress', 'urAtrNo', 'urRciNo', 'urSiNo', 'urBranch']
        .forEach(id => { urEl(id).value = ''; });
      urEl('urDate').value = urToday();
      urEl('urTxnId').value = 'Generating…';
      urEl('urCustomerStatus').textContent = '';
      urEl('urError').classList.add('hidden');
      urEl('urBranchHead').classList.toggle('hidden', !urScopeAll());
      urShowStep(1);
      showPage('createSalePage', null);

      google.script.run
        .withSuccessHandler(function (res) {
          if (formVersion !== urFormVersion) return;
          ur.transactionId = (res && res.transactionId) || '';
          urEl('urTxnId').value = ur.transactionId || '—';
        })
        .withFailureHandler(function (e) {
          if (formVersion !== urFormVersion) return;
          urEl('urTxnId').value = '—';
          window.mcAlert('' + e, { title: 'Could not start Unit Release' });
        })
        .beginUnitRelease();

      urEl('urUnitsStatus').textContent = 'Loading available units…';
      urEl('urUnitsBody').innerHTML = '';
      urUpdateContinue();
      google.script.run
        .withSuccessHandler(function (units) { if (formVersion !== urFormVersion) return; ur.units = units || []; renderUrUnits(); })
        .withFailureHandler(function (e) { if (formVersion === urFormVersion) urEl('urUnitsStatus').textContent = 'Failed: ' + e; })
        .getAvailableUnits(ur.scope);
    };

    function urShowStep(n) {
      urEl('urStep1').classList.toggle('hidden', n !== 1);
      urEl('urStep2').classList.toggle('hidden', n !== 2);
      urEl('urStepLabel').textContent = n === 1
        ? 'Step 1 of 2 — Select an available motorcycle'
        : 'Step 2 of 2 — Complete the Unit Release form';
      if (window.lucide) lucide.createIcons();
    }

    function urTypeBadge(u) {
      if (u.unitType === 'Repo') return '<span class="px-2 py-0.5 text-xs rounded border border-amber-200 text-amber-700">Repo</span>';
      if (u.unitType === 'Brand-New') return '<span class="px-2 py-0.5 text-xs rounded border border-slate-200 text-slate-600">Brand-New</span>';
      return '<span class="px-2 py-0.5 text-xs rounded-full bg-red-50 text-red-700">Invalid type: ' + window.mcEscape(u.unitTypeRaw) + '</span>';
    }

    window.renderUrUnits = function () {
      const q = (urEl('urEngineSearch').value || '').trim().toLowerCase();
      const all = urScopeAll();
      const rows = ur.units.filter(u => !q || (u.engineNo || '').toLowerCase().includes(q));
      const body = urEl('urUnitsBody');
      if (!rows.length) {
        const msg = ur.units.length ? 'No unit matches that engine number.' : 'No available units.';
        body.innerHTML = '<tr><td colspan="' + (all ? 7 : 6) + '" class="text-center py-8 text-slate-400">' + msg + '</td></tr>';
      } else {
        body.innerHTML = rows.map(u => {
          const invalid = u.unitType === 'Invalid';
          const sel = u.mcid === ur.selectedMcid;
          return `<tr data-mcid="${window.mcEscape(u.mcid)}" class="${invalid ? 'opacity-60' : 'hover:bg-slate-50 cursor-pointer'} ${sel ? 'bg-orange-50' : ''}" ${invalid ? '' : 'onclick="selectUrUnit(this.dataset.mcid)"'}>
            <td class="px-4 py-3"><input type="radio" name="urUnit" ${sel ? 'checked' : ''} ${invalid ? 'disabled' : ''} data-no-uppercase /></td>
            <td class="px-4 py-3 font-mono text-slate-800">${window.mcEscape(u.engineNo)}</td>
            <td class="px-4 py-3 font-mono text-slate-600">${window.mcEscape(u.chassisNo)}</td>
            <td class="px-4 py-3 text-slate-700">${window.mcEscape(u.model)}</td>
            <td class="px-4 py-3 text-slate-700">${window.mcEscape(u.color)}</td>
            <td class="px-4 py-3">${urTypeBadge(u)}</td>
            ${all ? `<td class="px-4 py-3 text-slate-700">${window.mcEscape(u.currentBranch)}</td>` : ''}
          </tr>`;
        }).join('');
      }
      urEl('urUnitsStatus').textContent = ur.units.length + ' available unit(s)';
      urUpdateContinue();
    };

    window.selectUrUnit = function (mcid) { ur.selectedMcid = mcid; renderUrUnits(); };

    function urUpdateContinue() {
      const u = ur.units.find(x => x.mcid === ur.selectedMcid);
      const ok = !!u && u.unitType !== 'Invalid';
      const btn = urEl('urContinueBtn');
      btn.disabled = !ok;
      btn.classList.toggle('opacity-60', !ok);
      btn.classList.toggle('cursor-not-allowed', !ok);
    }

    window.urContinue = function () {
      const unit = ur.units.find(u => u.mcid === ur.selectedMcid);
      if (!unit || unit.unitType === 'Invalid') return;
      const branchChanged = unit.currentBranch !== ur.branch;
      ur.unit = unit;
      ur.branch = unit.currentBranch;
      [['urMcid', unit.mcid], ['urEngine', unit.engineNo], ['urChassis', unit.chassisNo], ['urModel', unit.model],
       ['urModelCode', unit.modelCode], ['urColor', unit.color], ['urCurBranch', unit.currentBranch], ['urCurStatus', unit.currentStatus]]
        .forEach(([id, v]) => { urEl(id).textContent = v || '-'; });
      urEl('urBranch').value = ur.branch;
      urEl('urTypeBadge').innerHTML = urTypeBadge(unit);
      urEl('urAtrWrap').classList.toggle('hidden', unit.unitType !== 'Brand-New');
      urEl('urRciWrap').classList.toggle('hidden', unit.unitType !== 'Repo');
      urEl('urError').classList.add('hidden');
      urShowStep(2);
      if (branchChanged || !ur.customersLoaded) urLoadCustomers();
    };

    window.urBackToStep1 = function () { urShowStep(1); renderUrUnits(); };

    // Customers always follow the selected unit's branch.
    function urLoadCustomers() {
      const request = ++urCustomerRequest;
      const formVersion = urFormVersion;
      ur.customersLoaded = false;
      ur.customers = [];
      ur.customer = null;
      urEl('urCustomerSearch').value = '';
      urEl('urContact').value = '';
      urEl('urAddress').value = '';
      urEl('urCustomerList').classList.add('hidden');
      const branch = ur.branch;
      const st = urEl('urCustomerStatus');
      st.textContent = 'Loading customers for ' + branch + '…';
      google.script.run
        .withSuccessHandler(function (rows) {
          if (branch !== ur.branch || request !== urCustomerRequest || formVersion !== urFormVersion) return;
          ur.customersLoaded = true;
          ur.customers = rows || [];
          if (document.activeElement === urEl('urCustomerSearch')) renderUrCustomers();
          st.textContent = ur.customers.length + ' eligible customer(s) at ' + branch + ' (approved Maker, no unit yet)';
        })
        .withFailureHandler(function (e) {
          if (request !== urCustomerRequest || formVersion !== urFormVersion) return;
          st.textContent = 'Failed to load customers: ' + e + '. Use Change unit, then Continue to retry.';
        })
        .getSaleCustomers(branch);
    }

    window.urCustomerTyped = function () {
      urCustomerIndex = -1;
      if (ur.customer) { ur.customer = null; urEl('urContact').value = ''; urEl('urAddress').value = ''; }
      renderUrCustomers();
    };

    function urCustomerMatches() {
      const q = (urEl('urCustomerSearch').value || '').trim().toLowerCase();
      return ur.customers.filter(c => !q ||
        (c.name || '').toLowerCase().includes(q) || (c.cid || '').toLowerCase().includes(q)).slice(0, 50);
    }

    window.closeUrCustomers = function () {
      urEl('urCustomerList').classList.add('hidden');
      urEl('urCustomerSearch').setAttribute('aria-expanded', 'false');
      urEl('urCustomerSearch').removeAttribute('aria-activedescendant');
      urCustomerIndex = -1;
    };

    window.urCustomerKeydown = function (event) {
      if (event.key === 'Escape') { closeUrCustomers(); return; }
      const rows = urCustomerMatches();
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!rows.length) urCustomerIndex = -1;
        else if (urCustomerIndex < 0) urCustomerIndex = event.key === 'ArrowDown' ? 0 : rows.length - 1;
        else urCustomerIndex = (urCustomerIndex + (event.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
        renderUrCustomers();
      } else if (event.key === 'Enter' && !urEl('urCustomerList').classList.contains('hidden') && rows[urCustomerIndex]) {
        event.preventDefault();
        selectUrCustomer(rows[urCustomerIndex].cid);
      }
    };

    window.renderUrCustomers = function () {
      const list = urEl('urCustomerList');
      const rows = urCustomerMatches();
      list.innerHTML = rows.length
        ? rows.map((c, i) => `<button type="button" role="option" tabindex="-1" id="urCustomerOption${i}" aria-selected="${i === urCustomerIndex}" data-cid="${window.mcEscape(c.cid)}" onmousedown="event.preventDefault()" onclick="selectUrCustomer(this.dataset.cid)" class="${i === urCustomerIndex ? 'bg-orange-50' : ''} w-full text-left px-3 py-2 text-sm hover:bg-slate-50 flex justify-between gap-3">
            <span class="text-slate-800">${window.mcEscape(c.name)}</span><span class="font-mono text-xs text-slate-400">${window.mcEscape(c.cid)}</span>
          </button>`).join('')
        : '<div class="px-3 py-2 text-sm text-slate-400">No matching customer.</div>';
      list.classList.remove('hidden');
      urEl('urCustomerSearch').setAttribute('aria-expanded', 'true');
      if (urCustomerIndex >= 0 && rows[urCustomerIndex]) {
        urEl('urCustomerSearch').setAttribute('aria-activedescendant', 'urCustomerOption' + urCustomerIndex);
      } else {
        urEl('urCustomerSearch').removeAttribute('aria-activedescendant');
      }
    };

    window.selectUrCustomer = function (cid) {
      const c = ur.customers.find(x => x.cid === cid);
      if (!c) return;
      ur.customer = c;   // CID / AID stay in form state only
      urEl('urCustomerSearch').value = c.name + '  (' + c.cid + ')';
      urEl('urContact').value = c.contact || '';
      urEl('urAddress').value = c.address || '';
      closeUrCustomers();
    };

    // Validate, then open the review-and-confirm modal (does NOT submit yet).
    let pendingSale = null;
    let scTimer = null;
    const SALE_REVIEW_SECONDS = 5;

    window.submitSale = function () {
      if (urSaving) return;
      const err = urEl('urError');
      err.classList.add('hidden');
      const show = m => { err.textContent = m; err.classList.remove('hidden'); return false; };
      const u = ur.unit;
      if (!ur.transactionId) return show('Transaction ID is not ready yet. Wait a moment, or start a new Unit Release.');
      if (!u) return show('Select a motorcycle first.');
      if (!urEl('urDate').value) return show('Date of Sale is required.');
      const accountNo = urEl('urAccountNo').value.trim();
      if (!accountNo) return show('Account No. is required.');
      if (!ur.customer) return show('Select a customer from the list.');
      const docs = { ATRNo: urEl('urAtrNo').value.trim(), SINo: urEl('urSiNo').value.trim(), RCINo: urEl('urRciNo').value.trim() };
      if (u.unitType === 'Brand-New' && !docs.ATRNo) return show('ATR No. is required.');
      if (u.unitType === 'Repo' && !docs.RCINo) return show('RCI No. is required.');
      if (!docs.SINo) return show('SI No. is required.');
      if (u.unitType === 'Brand-New') docs.RCINo = ''; else docs.ATRNo = '';

      pendingSale = {
        saleNo: 'SALE-' + docs.SINo, unit: u, customer: ur.customer, accountNo: accountNo, docs: docs,
        payload: {
          TransactionID: ur.transactionId, MCID: u.mcid, CID: ur.customer.cid, Scope: ur.scope,
          SaleDate: urEl('urDate').value, AccountNo: accountNo,
          ATRNo: docs.ATRNo, SINo: docs.SINo, RCINo: docs.RCINo, CreatedBy: (window._userEmail || '')
        }
      };
