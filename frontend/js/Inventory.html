      openSaleReview();
    };

    function openSaleReview() {
      const p = pendingSale; if (!p) return;
      urEl('scNo').textContent = p.saleNo;
      urEl('scTxnId').textContent = p.payload.TransactionID;
      urEl('scCustomer').textContent = p.customer.name + ' (' + p.customer.cid + ')';
      urEl('scAccount').textContent = p.accountNo;
      urEl('scBranch').textContent = ur.branch;
      urEl('scDocs').textContent = (p.unit.unitType === 'Repo' ? 'RCI ' + p.docs.RCINo : 'ATR ' + p.docs.ATRNo) + ' · SI ' + p.docs.SINo;
      urEl('scUnitsBody').innerHTML = `
        <tr class="border-t border-slate-100">
          <td class="px-4 py-2 font-mono text-slate-800">${window.mcEscape(p.unit.engineNo) || '-'}</td>
          <td class="px-4 py-2 font-mono text-slate-600">${window.mcEscape(p.unit.chassisNo) || '-'}</td>
          <td class="px-4 py-2 text-slate-700">${window.mcEscape(p.unit.model) || '-'}</td>
          <td class="px-4 py-2 text-slate-700">${window.mcEscape(p.unit.unitType)}</td>
        </tr>`;
      urEl('saleConfirmModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
      startSaleCountdown(SALE_REVIEW_SECONDS);
    }

    function startSaleCountdown(sec) {
      const btn = urEl('scConfirmBtn');
      if (scTimer) { clearInterval(scTimer); scTimer = null; }
      let remaining = sec;
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      btn.textContent = 'Please review… (' + remaining + ')';
      scTimer = setInterval(function () {
        remaining--;
        if (remaining <= 0) {
          clearInterval(scTimer); scTimer = null;
          btn.disabled = false;
          btn.classList.remove('opacity-60', 'cursor-not-allowed');
          btn.textContent = 'Confirm & Release';
        } else {
          btn.textContent = 'Please review… (' + remaining + ')';
        }
      }, 1000);
    }

    window.closeSaleReview = function () {
      if (urSaving) return;
      pendingSale = null;
      if (scTimer) { clearInterval(scTimer); scTimer = null; }
      urEl('saleConfirmModal').classList.add('hidden');
      document.body.style.overflow = '';
    };

    // Create the Unit Release; server errors stay in the existing alert component.
    window.confirmSaleFinal = function () {
      const p = pendingSale; if (!p) return;
      const btn = urEl('scConfirmBtn');
      if (btn.disabled) return; // guard: countdown not finished / already saving
      urSaving = true;
      btn.disabled = true; btn.textContent = 'Saving…';
      google.script.run
        .withSuccessHandler(function (res) {
          urSaving = false;
          if (!res || !res.success) {
            btn.disabled = false; btn.textContent = 'Confirm & Release';
            window.mcAlert((res && res.message) || 'Failed to create Unit Release.', { title: 'Could not release unit' });
            return;
          }
          closeSaleReview();
          pendingSale = null;
          window.mcToast('Unit Release ' + res.transactionNo + ' recorded — ' + (p.unit.engineNo || '') + ' sold', 'success');
          window.mcInventoryLoaded = false; window.invDashLoaded = false;
          urEl('salesSearch').value = '';
          showPage('salesPage', null);
        })
        .withFailureHandler(function (e) {
          urSaving = false;
          btn.disabled = false; btn.textContent = 'Confirm & Release';
          window.mcAlert('' + e, { title: 'Could not release unit' });
        })
        .createUnitRelease(p.payload);
    };
  })();
  </script>

  <!-- ==================== PHASE 4 — MOVEMENT HISTORY ==================== -->
  <script>
  (function () {
    window.loadMovementHistory = function () {
      const status = document.getElementById('mhStatus');
      if (status) status.innerHTML = '<i data-lucide="loader" class="w-4 h-4 mr-2 animate-spin"></i> Loading movement history…';
      window.mcSkelRows('mhBody', 7);
      if (window.lucide) lucide.createIcons();
      const filters = {
        mcid: val('mhFilterMCID'),
        engineNo: val('mhFilterEngine'),
        transactionNo: val('mhFilterTxn'),
        dateFrom: val('mhFilterFrom'),
        dateTo: val('mhFilterTo'),
        branch: window._userBranch || 'ALL'  // scope to logged-in branch (ALL = global) [Adjustment #4]
      };
      google.script.run
        .withSuccessHandler(renderMovementHistory)
        .withFailureHandler(function (err) { if (status) status.innerHTML = '<span class="text-red-600">Failed: ' + err + '</span>'; })
        .getMovementHistory(filters);
    };
    function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }

    window.applyMovementFilters = function () { loadMovementHistory(); };
    window.clearMovementFilters = function () {
      ['mhFilterMCID', 'mhFilterEngine', 'mhFilterTxn', 'mhFilterFrom', 'mhFilterTo'].forEach(id => {
        const el = document.getElementById(id); if (el) el.value = '';
      });
      loadMovementHistory();
    };

    const mhState = { currentPage: 1, filteredRows: [] };
    function renderMovementHistory(rows) {
      mhState.filteredRows = rows || [];
      mhState.currentPage = 1;
      drawMovementPage();
    }
    function drawMovementPage() {
      const body = document.getElementById('mhBody');
      const status = document.getElementById('mhStatus');
      const total = mhState.filteredRows.length;
      const rows = window.paginateRows(mhState.filteredRows, mhState.currentPage);
      if (!total) {
        body.innerHTML = '<tr><td colspan="7" class="text-center py-12 text-slate-400">No movements found.</td></tr>';
      } else {
        body.innerHTML = rows.map(m => `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4 text-slate-600">${window.mcEscape(m.date)}</td>
            <td class="px-6 py-4 font-mono text-xs text-slate-500">${window.mcEscape(m.mcid)}</td>
            <td class="px-6 py-4 font-mono text-slate-800">${window.mcEscape(m.engineNo)}</td>
            <td class="px-6 py-4">
              <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ${window.mcTypeBadge(m.transactionType)} mr-1.5">${window.mcEscape(m.transactionType)}</span>
              <span class="font-mono text-slate-700">${window.mcEscape(m.transactionNo)}</span>
            </td>
            <td class="px-6 py-4 text-slate-600">${window.mcEscape(m.from)}</td>
            <td class="px-6 py-4 text-slate-600">${window.mcEscape(m.to)}</td>
            <td class="px-6 py-4 text-slate-500 text-sm">${window.mcEscape(m.user)}</td>
          </tr>`).join('');
      }
      if (status) status.innerHTML = '<i data-lucide="list" class="w-4 h-4 mr-2"></i> Showing <strong class="mx-1">' + total + '</strong> movement' + (total === 1 ? '' : 's');
      window.renderPagination(mhState, 'mhPaginationControls', 'mhPaginationInfo', 'mhPaginationBar', drawMovementPage);
      if (window.lucide) lucide.createIcons();
    }
  })();
  </script>

  <!-- ==================== MC — GLOBAL UX HELPERS ==================== -->
  <script>
  (function () {
    // ── Skeleton loaders (shimmer placeholders shown until data arrives) ──
    window.mcSkelRows = function (tbodyId, cols, rows) {
      const tb = document.getElementById(tbodyId);
      if (!tb) return;
      rows = rows || 6;
      let html = '';
      for (let i = 0; i < rows; i++) {
        html += '<tr class="animate-pulse">';
        for (let c = 0; c < cols; c++) {
          const w = 40 + ((i * 7 + c * 13) % 50);
          html += '<td class="px-6 py-4"><div class="h-4 bg-slate-200 rounded" style="width:' + w + '%"></div></td>';
        }
        html += '</tr>';
      }
      tb.innerHTML = html;
    };
    window.mcSkelCards = function (ids) {
      ids.forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="h-8 w-20 bg-slate-200 rounded animate-pulse"></div>';
      });
    };
    window.mcSkelList = function (elId, lines) {
      const el = document.getElementById(elId);
      if (!el) return;
      lines = lines || 5;
      let html = '';
      for (let i = 0; i < lines; i++) {
        html += '<div class="px-5 py-3 flex items-center justify-between animate-pulse">' +
          '<div class="flex items-center gap-3"><div class="h-6 w-14 bg-slate-200 rounded-full"></div>' +
          '<div><div class="h-3.5 w-28 bg-slate-200 rounded mb-1.5"></div><div class="h-3 w-40 bg-slate-100 rounded"></div></div></div>' +
          '<div class="h-3 w-16 bg-slate-200 rounded"></div></div>';
      }
      el.innerHTML = html;
    };
    window.mcChartSkel = function (canvasId, on) {
      const canvas = document.getElementById(canvasId);
      if (!canvas || !canvas.parentElement) return;
      const parent = canvas.parentElement;
      let sk = parent.querySelector('.mc-chart-skel');
      if (on) {
        parent.style.position = 'relative';
        canvas.style.visibility = 'hidden';
        if (!sk) { sk = document.createElement('div'); sk.className = 'mc-chart-skel absolute inset-0 rounded-lg bg-slate-100 animate-pulse'; parent.appendChild(sk); }
      } else {
        canvas.style.visibility = '';
        if (sk) sk.remove();
      }
    };

    // ── Acknowledgment modal for important errors / notices ──
    // mcAlert(message, { title, type:'error'|'success'|'info', onOk })
    window.mcAlert = function (message, opts) {
      opts = opts || {};
      const type = opts.type || 'error';
      const title = opts.title || (type === 'error' ? 'Something went wrong' : type === 'success' ? 'Success' : 'Notice');
      const accent = type === 'error' ? { ring: 'bg-red-100 text-red-600', btn: 'bg-red-600 hover:bg-red-700', icon: 'alert-triangle' }
        : type === 'success' ? { ring: 'bg-emerald-100 text-emerald-600', btn: 'bg-emerald-600 hover:bg-emerald-700', icon: 'check-circle' }
        : { ring: 'bg-blue-100 text-blue-600', btn: 'bg-blue-700 hover:bg-blue-800', icon: 'info' };

      let host = document.getElementById('mcAlertModal');
      if (host) host.remove();
      host = document.createElement('div');
      host.id = 'mcAlertModal';
      host.className = 'fixed inset-0 z-[120] flex items-center justify-center p-4';
      host.innerHTML =
        '<div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>' +
        '<div class="relative w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden">' +
          '<div class="p-6 text-center">' +
            '<div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl ' + accent.ring + '">' +
              '<i data-lucide="' + accent.icon + '" class="w-6 h-6"></i>' +
            '</div>' +
            '<h3 class="text-base font-bold text-slate-900">' + window.mcEscape(title) + '</h3>' +
            '<p class="mt-1 text-sm text-slate-600">' + window.mcEscape(message) + '</p>' +
          '</div>' +
          '<div class="px-6 pb-6">' +
            '<button id="mcAlertOk" class="w-full px-4 py-2 text-sm rounded-lg text-white font-semibold ' + accent.btn + '">OK</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(host);
      if (window.lucide) lucide.createIcons();
      const close = function () { host.remove(); if (typeof opts.onOk === 'function') opts.onOk(); };
      host.querySelector('#mcAlertOk').addEventListener('click', close);
      host.querySelector('#mcAlertOk').focus();
    };

    // ── Auto-uppercase all text inputs inside MC pages/modals ──
    // Scoped to the MC system so it never touches the buyer (CAS/CIR/Cash) forms.
    const MC_SCOPE = '#newRRModal, #confirmReceiptModal, #inventoryDashboardPage, #mcInventoryPage,' +
      '#rrListPage, #rrDetailsPage, #transfersPage, #createTransferPage,' +
      '#salesPage, #createSalePage, #movementHistoryPage, #unitProfilePage';
    document.addEventListener('input', function (e) {
      const el = e.target;
      if (!el || !el.matches || !el.matches('input[type=text], textarea')) return;
      if (el.dataset && el.dataset.noUppercase !== undefined) return;
      if (!el.closest(MC_SCOPE)) return;
      const s = el.selectionStart, en = el.selectionEnd;
      const up = el.value.toUpperCase();
      if (up !== el.value) {
        el.value = up;
        try { el.setSelectionRange(s, en); } catch (_) {}
      }
    }, true);
  })();
  </script>
